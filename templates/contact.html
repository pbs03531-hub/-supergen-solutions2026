{% extends "base.html" %}

{% block title %}
Start a Project | SuperGen Solutions
{% endblock %}

{% block content %}

<section class="page-hero">

    <span>START A PROJECT</span>

    <h1>
        Tell us what you're building.
    </h1>

    <p>
        Share a few details about your business and requirement.
        We'll review it and get back to you.
    </p>

</section>


<section class="contact-section">

    <form method="POST" class="contact-form">

        <div class="form-row">

            <div>
                <label for="name">
                    Your Name *
                </label>

                <input
                    type="text"
                    id="name"
                    name="name"
                    placeholder="Your name"
                    required
                >
            </div>


            <div>
                <label for="business_name">
                    Business Name
                </label>

                <input
                    type="text"
                    id="business_name"
                    name="business_name"
                    placeholder="Your business name"
                >
            </div>

        </div>


        <div class="form-row">

            <div>
                <label for="email">
                    Email *
                </label>

                <input
                    type="email"
                    id="email"
                    name="email"
                    placeholder="you@example.com"
                    required
                >
            </div>


            <div>
                <label for="phone">
                    Phone *
                </label>

                <input
                    type="tel"
                    id="phone"
                    name="phone"
                    placeholder="+91"
                    required
                >
            </div>

        </div>


        <div class="form-row">

            <div>
                <label for="city">
                    City
                </label>

                <input
                    type="text"
                    id="city"
                    name="city"
                    placeholder="Your city"
                >
            </div>


            <div>
                <label for="service">
                    What do you need? *
                </label>

                <select
                    id="service"
                    name="service"
                    required
                >

                    <option value="">
                        Select a service
                    </option>

                    <option>
                        Website Development
                    </option>

                    <option>
                        Web Application
                    </option>

                    <option>
                        AI Solution
                    </option>

                    <option>
                        Business Automation
                    </option>

                    <option>
                        Digital Growth
                    </option>

                    <option>
                        Custom Technology
                    </option>

                </select>

            </div>

        </div>


        <div>

            <label for="budget">
                Approximate Budget
            </label>

            <select
                id="budget"
                name="budget"
            >

                <option value="">
                    Prefer not to say
                </option>

                <option>
                    Under ₹10,000
                </option>

                <option>
                    ₹10,000 – ₹25,000
                </option>

                <option>
                    ₹25,000 – ₹50,000
                </option>

                <option>
                    ₹50,000+
                </option>

            </select>

        </div>


        <div>

            <label for="message">
                Tell us about your project
            </label>

            <textarea
                id="message"
                name="message"
                rows="7"
                placeholder="What are you trying to build or what problem are you trying to solve?"
            ></textarea>

        </div>


        <button
            type="submit"
            class="primary-btn"
        >
            Send Project Request →
        </button>

    </form>

</section>

{% endblock %}
